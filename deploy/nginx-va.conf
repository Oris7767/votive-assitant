# ============================================================
# Nginx config — va.vedicvn.sbs
# Deploy: scp to /etc/nginx/sites-available/va.vedicvn.sbs
# Enable: ln -s /etc/nginx/sites-available/va.vedicvn.sbs /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    server_name va.vedicvn.sbs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name va.vedicvn.sbs;

    ssl_certificate /etc/letsencrypt/live/va.vedicvn.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/va.vedicvn.sbs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to VA FastAPI server
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
